# Capture settings shared by stream.sh (sourced) and ps176_link.py / pi_server.py (parsed).
# Plain KEY=VALUE only. Environment variables of the same name override these values.

# managed   = start stream, wait for PS176 link, capture, stop stream
# always-on = existing behaviour (stream started separately with ./stream.sh start-5fps)
CAPTURE_MODE=managed

I2C_BUS=6
PS176_BASE=0x48        # pages: base+0 (0x48 MSA), +1 (0x49 DPCD), +2 (0x4A HPD)

LINK_TIMEOUT=15        # seconds to wait for link+video before HPD toggle / failure
LINK_DOWN_TIMEOUT=15   # seconds to wait for the link to drop after the stream stops
SETTLE_MS=1500         # wait after link-up so the MS2130 has fresh frames
CAPTURE_RETRIES=3      # re-captures if the link dropped during a grab
POLL_MS=50             # PS176 poll interval

LOCK_FILE=/tmp/capture.lock
